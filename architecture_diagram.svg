<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1040" height="520" fill="#ffffff"/>

  <text x="40" y="44" font-size="21" font-weight="600" fill="#111827">Ask ULIP — two-stage retrieval with a grounding gate</text>
  <text x="40" y="68" font-size="13.5" fill="#6b7280">Bi-encoder provides recall cheaply · cross-encoder provides precision expensively · threshold gates generation</text>

  <!-- Stage 1 band -->
  <rect x="40" y="96" width="440" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="122" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.8">STAGE 1 — RECALL</text>

  <!-- Stage 2 band -->
  <rect x="512" y="96" width="488" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="532" y="122" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.8">STAGE 2 — PRECISION</text>

  <!-- Query -->
  <rect x="62" y="140" width="128" height="62" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="126" y="166" font-size="14" font-weight="600" fill="#3730a3" text-anchor="middle">User query</text>
  <text x="126" y="186" font-size="11.5" fill="#4f46e5" text-anchor="middle">natural language</text>

  <!-- Bi-encoder -->
  <rect x="214" y="140" width="110" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="269" y="162" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Bi-encoder</text>
  <text x="269" y="180" font-size="10.5" fill="#6b7280" text-anchor="middle">all-MiniLM-L6-v2</text>
  <text x="269" y="194" font-size="10.5" fill="#6b7280" text-anchor="middle">384-dim, normalised</text>

  <!-- FAISS -->
  <rect x="348" y="140" width="110" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="403" y="162" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">FAISS</text>
  <text x="403" y="180" font-size="10.5" fill="#6b7280" text-anchor="middle">IndexFlatIP</text>
  <text x="403" y="194" font-size="10.5" fill="#6b7280" text-anchor="middle">cosine via dot product</text>

  <text x="260" y="238" font-size="11.5" fill="#64748b">28 indexed chunks · 16 public documents</text>

  <!-- arrows stage1 -->
  <path d="M190 171 L210 171" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M324 171 L344 171" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- bridge arrow with label -->
  <path d="M458 171 L534 171" stroke="#0f172a" stroke-width="2" marker-end="url(#ahd)"/>
  <rect x="452" y="96" width="118" height="22" rx="6" fill="#0f172a"/>
  <text x="511" y="111" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">15 candidates</text>

  <!-- Cross-encoder -->
  <rect x="538" y="140" width="138" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="607" y="162" font-size="13" font-weight="600" fill="#78350f" text-anchor="middle">Cross-encoder</text>
  <text x="607" y="180" font-size="10.5" fill="#92400e" text-anchor="middle">ms-marco-MiniLM-L-6-v2</text>
  <text x="607" y="194" font-size="10.5" fill="#92400e" text-anchor="middle">scores query + chunk jointly</text>

  <!-- Gate -->
  <rect x="712" y="140" width="130" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="777" y="164" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Grounding gate</text>
  <text x="777" y="185" font-size="11" fill="#6b7280" text-anchor="middle">rerank score ≥ 2.0 ?</text>

  <path d="M676 171 L708 171" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="692" y="230" font-size="11.5" fill="#64748b" text-anchor="middle">top 5</text>

  <!-- Refuse -->
  <rect x="872" y="112" width="112" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="928" y="134" font-size="12.5" font-weight="600" fill="#991b1b" text-anchor="middle">Refuse</text>
  <text x="928" y="151" font-size="10.5" fill="#b91c1c" text-anchor="middle">no sufficient evidence</text>

  <!-- Generate -->
  <rect x="872" y="180" width="112" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="928" y="201" font-size="12.5" font-weight="600" fill="#065f46" text-anchor="middle">Gemini</text>
  <text x="928" y="218" font-size="10.5" fill="#047857" text-anchor="middle">grounded answer</text>
  <text x="928" y="232" font-size="10.5" fill="#047857" text-anchor="middle">+ cited sources</text>

  <path d="M842 160 L852 160 L852 138 L868 138" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ahr)"/>
  <path d="M842 182 L852 182 L852 208 L868 208" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#ahg)"/>
  <text x="858" y="128" font-size="10" font-weight="600" fill="#dc2626">no</text>
  <text x="856" y="226" font-size="10" font-weight="600" fill="#059669">yes</text>

  <!-- Why two stages -->
  <rect x="40" y="302" width="440" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="62" y="328" font-size="13" font-weight="700" fill="#111827">Why two stages</text>
  <text x="62" y="352" font-size="11.8" fill="#374151">Bi-encoder embeds query and chunk separately, so its score</text>
  <text x="62" y="370" font-size="11.8" fill="#374151">measures topical resemblance, not answerability.</text>
  <text x="62" y="396" font-size="11.8" fill="#374151">Cross-encoder reads the pair together and judges whether the</text>
  <text x="62" y="414" font-size="11.8" fill="#374151">chunk answers the question — a sharper but costlier signal.</text>
  <text x="62" y="440" font-size="11.8" fill="#374151">One forward pass per chunk makes it infeasible corpus-wide,</text>
  <text x="62" y="458" font-size="11.8" fill="#374151">so it runs only over the shortlist.</text>

  <!-- Separation evidence -->
  <rect x="512" y="302" width="488" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="534" y="328" font-size="13" font-weight="700" fill="#111827">Top-1 score distributions across 42 labelled cases</text>

  <text x="534" y="356" font-size="11" fill="#6b7280">Bi-encoder (cosine)</text>
  <rect x="534" y="364" width="258" height="15" rx="3" fill="#fecaca"/>
  <rect x="640" y="364" width="320" height="15" rx="3" fill="#bbf7d0" opacity="0.82"/>
  <text x="800" y="376" font-size="10" fill="#991b1b">overlap 0.40 – 0.63</text>
  <text x="534" y="394" font-size="10.5" fill="#6b7280">out-of-corpus 0.10–0.63 · answerable 0.40–0.83 — no clean cutoff</text>

  <text x="534" y="424" font-size="11" fill="#6b7280">Cross-encoder (relevance logit)</text>
  <rect x="534" y="432" width="286" height="15" rx="3" fill="#fecaca"/>
  <rect x="836" y="432" width="124" height="15" rx="3" fill="#bbf7d0"/>
  <path d="M828 430 L828 450" stroke="#0f172a" stroke-width="1.6" stroke-dasharray="3,2"/>
  <text x="534" y="462" font-size="10.5" fill="#6b7280">out-of-corpus -11.21–2.19 · answerable 2.28–9.94 — separable at 2.0</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/>
    </marker>
    <marker id="ahd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#0f172a"/>
    </marker>
    <marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#dc2626"/>
    </marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
